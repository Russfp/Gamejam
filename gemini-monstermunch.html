<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghoulish Gourmet</title>
  <style>
    :root {
      --bg-color: #120e1e;
      --panel-bg: #1f1833;
      --accent-green: #50fa7b;
      --accent-purple: #bd93f9;
      --accent-red: #ff5555;
      --accent-yellow: #f1fa8c;
      --text-light: #f8f8f2;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background-color: var(--panel-bg);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--accent-purple);
    }

    /* Header & Customer Area */
    #customer-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #281e45 0%, var(--panel-bg) 100%);
      padding: 15px;
      position: relative;
    }

    #customer-avatar {
      font-size: 80px;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .bounce {
      transform: scale(1.1);
    }

    #order-bubble {
      position: absolute;
      top: 15px;
      right: 20px;
      background-color: var(--text-light);
      color: #000;
      padding: 10px 15px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #order-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 20px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: var(--text-light) transparent;
      display: block;
      width: 0;
    }

    #patience-bar-container {
      width: 80%;
      height: 10px;
      background-color: #44475a;
      border-radius: 5px;
      margin-top: 15px;
      overflow: hidden;
    }

    #patience-bar {
      width: 100%;
      height: 100%;
      background-color: var(--accent-green);
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* Gameplay Area */
    #work-area {
      flex: 1.5;
      background-color: #151026;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .stage-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-yellow);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Minigame 1: Chopping */
    #chop-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #eyeball-target {
      width: 100px;
      height: 100px;
      background-color: #ff5555;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 85, 85, 0.4);
      transition: transform 0.05s;
    }

    #eyeball-target:active {
      transform: scale(0.9);
    }

    /* Minigame 2: Stirring */
    #stir-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #cauldron {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #8be9fd 0%, #44475a 70%);
      border: 8px solid #6272a4;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: none;
    }

    #spoon {
      font-size: 40px;
      position: absolute;
      pointer-events: none;
    }

    /* Minigame 3: Temperature Control */
    #heat-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #meter-container {
      width: 40px;
      height: 150px;
      background-color: #44475a;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      border: 2px solid #6272a4;
    }

    #sweet-spot {
      position: absolute;
      width: 100%;
      height: 40px;
      top: 40px;
      background-color: rgba(80, 250, 123, 0.4);
      border-top: 2px solid var(--accent-green);
      border-bottom: 2px solid var(--accent-green);
    }

    #heat-indicator {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 10px;
      background-color: var(--accent-red);
      transition: height 0.05s ease-out;
    }

    .game-btn {
      background-color: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      margin-top: 15px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .game-btn:active {
      transform: translateY(2px);
    }

    /* UI Overlay */
    #score-board {
      position: absolute;
      top: 10px;
      left: 10px;
      font-weight: bold;
      color: var(--accent-green);
      font-size: 16px;
    }

    .hidden {
      display: none !important;
    }

    #screen-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(18, 14, 30, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    #screen-overlay h1 {
      color: var(--accent-green);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-board">Gold: <span id="score">0</span></div>

  <div id="customer-area">
    <div id="order-bubble">Wants: <span id="recipe-name">Eyeball Soup</span></div>
    <div id="customer-avatar">👹</div>
    <div id="patience-bar-container">
      <div id="patience-bar"></div>
    </div>
  </div>

  <div id="work-area">
    <div id="chop-game" class="minigame">
      <div class="stage-title">Tap Fast to Slice Eyeballs!</div>
      <div id="eyeball-target">👁️</div>
      <p>Slices needed: <span id="chop-count">5</span></p>
    </div>

    <div id="stir-game" class="minigame hidden">
      <div class="stage-title">Swirl Finger to Stir Gloop!</div>
      <div id="cauldron">
        <div id="spoon">🥄</div>
      </div>
      <p>Progress: <span id="stir-progress">0</span>%</p>
    </div>

    <div id="heat-game" class="minigame hidden">
      <div class="stage-title">Hold Button to Match Heat!</div>
      <div id="meter-container">
        <div id="sweet-spot"></div>
        <div id="heat-indicator"></div>
      </div>
      <button class="game-btn" id="heat-btn">HEAT UP</button>
    </div>
  </div>

  <div id="screen-overlay">
    <h1 id="overlay-title">Ghoulish Gourmet</h1>
    <p id="overlay-msg">Feed the hungry monsters before they lose patience!</p>
    <button class="game-btn" id="start-btn">PLAY</button>
  </div>
</div>

<script>
  // Game State Variables
  let gold = 0;
  let currentStage = 0; // 0: Chop, 1: Stir, 2: Heat
  let patience = 100;
  let patienceTimer = null;
  let gameActive = false;

  const monsters = ['👹', '👽', '👾', '👺', '👻', '🧛'];
  const recipes = ['Eyeball Soup', 'Slime Stew', 'Gloom Broth'];

  // Minigame State
  let chopsLeft = 5;
  let stirAngle = 0;
  let lastAngle = null;
  let stirProgress = 0;
  let heatLevel = 0;
  let heatInterval = null;
  let heatSuccessTimer = 0;

  // DOM Elements
  const scoreEl = document.getElementById('score');
  const customerAvatar = document.getElementById('customer-avatar');
  const recipeNameEl = document.getElementById('recipe-name');
  const patienceBar = document.getElementById('patience-bar');
  const overlay = document.getElementById('screen-overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');

  const chopGame = document.getElementById('chop-game');
  const stirGame = document.getElementById('stir-game');
  const heatGame = document.getElementById('heat-game');

  const eyeballTarget = document.getElementById('eyeball-target');
  const chopCountEl = document.getElementById('chop-count');
  const cauldron = document.getElementById('cauldron');
  const stirProgressEl = document.getElementById('stir-progress');
  const heatBtn = document.getElementById('heat-btn');
  const heatIndicator = document.getElementById('heat-indicator');

  // Start / Restart Game
  startBtn.addEventListener('click', () => {
    gold = 0;
    scoreEl.textContent = gold;
    overlay.classList.add('hidden');
    gameActive = true;
    nextCustomer();
  });

  function nextCustomer() {
    if (!gameActive) return;
    
    // Reset Customer
    customerAvatar.textContent = monsters[Math.floor(Math.random() * monsters.length)];
    recipeNameEl.textContent = recipes[Math.floor(Math.random() * recipes.length)];
    customerAvatar.classList.add('bounce');
    setTimeout(() => customerAvatar.classList.remove('bounce'), 300);

    // Reset Patience
    patience = 100;
    clearInterval(patienceTimer);
    patienceTimer = setInterval(() => {
      patience -= 1.5;
      patienceBar.style.width = patience + '%';
      
      if (patience < 30) {
        patienceBar.style.backgroundColor = 'var(--accent-red)';
      } else {
        patienceBar.style.backgroundColor = 'var(--accent-green)';
      }

      if (patience <= 0) {
        gameOver();
      }
    }, 200);

    // Start Stage 1
    startStage(0);
  }

  function startStage(stageNum) {
    currentStage = stageNum;
    chopGame.classList.add('hidden');
    stirGame.classList.add('hidden');
    heatGame.classList.add('hidden');

    if (stageNum === 0) {
      chopGame.classList.remove('hidden');
      chopsLeft = 5;
      chopCountEl.textContent = chopsLeft;
    } else if (stageNum === 1) {
      stirGame.classList.remove('hidden');
      stirProgress = 0;
      lastAngle = null;
      stirProgressEl.textContent = '0';
    } else if (stageNum === 2) {
      heatGame.classList.remove('hidden');
      heatLevel = 0;
      heatSuccessTimer = 0;
      runHeatLoop();
    }
  }

  function completeRecipe() {
    clearInterval(patienceTimer);
    clearInterval(heatInterval);
    gold += Math.floor(patience);
    scoreEl.textContent = gold;
    
    // Brief celebration delay
    setTimeout(() => {
      nextCustomer();
    }, 500);
  }

  function gameOver() {
    gameActive = false;
    clearInterval(patienceTimer);
    clearInterval(heatInterval);
    overlayTitle.textContent = "Customer Left!";
    overlayMsg.textContent = `You earned ${gold} Monster Gold.`;
    startBtn.textContent = "TRY AGAIN";
    overlay.classList.remove('hidden');
  }

  // --- MINIGAME 1: CHOPPING ---
  eyeballTarget.addEventListener('pointerdown', () => {
    if (currentStage !== 0) return;
    chopsLeft--;
    chopCountEl.textContent = chopsLeft;
    eyeballTarget.style.transform = 'scale(0.8)';
    setTimeout(() => eyeballTarget.style.transform = 'scale(1)', 50);

    if (chopsLeft <= 0) {
      startStage(1);
    }
  });

  // --- MINIGAME 2: STIRRING ---
  function handleStir(e) {
    if (currentStage !== 1) return;
    const rect = cauldron.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    // Get client touch/mouse position
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const rad = Math.atan2(clientY - centerY, clientX - centerX);
    const deg = rad * (180 / Math.PI);

    if (lastAngle !== null) {
      let delta = Math.abs(deg - lastAngle);
      if (delta < 180) { // Avoid wrap-around jump anomalies
        stirProgress += delta / 10;
        if (stirProgress > 100) stirProgress = 100;
        stirProgressEl.textContent = Math.floor(stirProgress);
      }
    }
    lastAngle = deg;

    if (stirProgress >= 100) {
      startStage(2);
    }
  }

  cauldron.addEventListener('pointermove', handleStir);
  cauldron.addEventListener('touchmove', handleStir);

  // --- MINIGAME 3: HEAT CONTROL ---
  let isHeating = false;

  const setHeating = (val) => { isHeating = val; };
  heatBtn.addEventListener('mousedown', () => setHeating(true));
  heatBtn.addEventListener('mouseup', () => setHeating(false));
  heatBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setHeating(true); });
  heatBtn.addEventListener('touchend', (e) => { e.preventDefault(); setHeating(false); });

  function runHeatLoop() {
    clearInterval(heatInterval);
    heatInterval = setInterval(() => {
      if (currentStage !== 2) return;

      if (isHeating) {
        heatLevel += 3;
      } else {
        heatLevel -= 2;
      }

      // Clamp Heat Level
      if (heatLevel < 0) heatLevel = 0;
      if (heatLevel > 100) heatLevel = 100;

      heatIndicator.style.height = heatLevel + '%';

      // Check if heat is within the target window (40% to 66% area)
      if (heatLevel >= 40 && heatLevel <= 66) {
        heatSuccessTimer += 5;
        if (heatSuccessTimer >= 100) {
          completeRecipe();
        }
      } else {
        heatSuccessTimer = Math.max(0, heatSuccessTimer - 2);
      }
    }, 50);
  }
</script>
</body>
</html>
